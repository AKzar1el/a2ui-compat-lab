name: A2UI Guarded PR Integration
on:
  schedule:
    - cron: '17,37,57 * * * *'
  # A successful PR CI run is a wake signal, never merge authorization.
  # Only the default-branch guard code evaluates GitHub's live PR state.
  workflow_run:
    workflows: ['A2UI Compatibility CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Inspect without merging'
        type: boolean
        default: true
permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write
concurrency:
  group: a2ui-guarded-merger
  cancel-in-progress: false
jobs:
  integrate:
    if: >-
      github.repository == 'AKzar1el/a2ui-compat-lab' &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.event == 'pull_request' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # never execute or import code from the originating PR
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Review at most one SHA-bound worker PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          A2UI_AUTO_MERGE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: node scripts/guarded-merge.mjs
